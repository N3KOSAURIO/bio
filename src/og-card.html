<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#080a12;font-family:Manrope,sans-serif;color:#eef2ff;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
.g1{width:640px;height:640px;background:rgba(53,109,255,.42);top:-300px;left:-160px}
.g2{width:560px;height:560px;background:rgba(133,63,255,.34);bottom:-280px;right:120px}
.g3{width:320px;height:320px;background:rgba(72,224,190,.16);top:180px;right:-80px}
.grid{position:absolute;inset:0;opacity:.30;background-image:linear-gradient(rgba(166,190,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(166,190,255,.10) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 30% 20%,black,transparent 78%)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:64px;padding:0 78px}
.left{flex:1}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}
.brand img{width:34px;height:34px;filter:drop-shadow(0 0 16px rgba(115,165,255,.6))}
.brand b{font:800 20px Manrope;letter-spacing:.14em}
.brand b span{color:#8eb7ff}
h1{font:800 78px/1.02 Manrope;letter-spacing:-.045em;margin-bottom:16px}
h1 span{color:#8eb5ff}
.role{font:800 15px Manrope;letter-spacing:.30em;color:#9dc0ff;margin-bottom:26px}
.desc{font:400 22px/1.5 "DM Sans";color:#b9c4dd;max-width:560px;margin-bottom:38px}
.url{display:inline-flex;align-items:center;gap:12px;font:700 16px Manrope;letter-spacing:.06em;color:#dfe7ff;border:1px solid rgba(185,202,239,.24);border-radius:40px;padding:12px 22px;background:rgba(255,255,255,.055)}
.dot{width:9px;height:9px;border-radius:50%;background:#70e0b0;box-shadow:0 0 14px rgba(112,224,176,.9)}
.photo{width:352px;height:352px;border-radius:50%;padding:5px;background:conic-gradient(from 200deg,#4f7fff,#a45bff,#48e0be,#4f7fff);box-shadow:0 40px 90px rgba(0,0,0,.55)}
.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#131826}
.chips{position:absolute;left:78px;bottom:52px;display:flex;gap:10px}
.chip{font:700 12px Manrope;letter-spacing:.13em;color:#cfdcff;border:1px solid rgba(185,202,239,.20);background:rgba(255,255,255,.05);border-radius:30px;padding:9px 16px}
</style></head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="grid"></div>
<div class="wrap">
  <div class="left">
    <div class="brand"><img src="../assets/brand/logo-mark.svg" alt=""><b>NEY<span>.</span></b></div>
    <h1>Sneyder<br>Arroyave<span>.</span></h1>
    <div class="role">IA · SOFTWARE · AUTOMATIZACIÓN</div>
    <p class="desc">Construyo sistemas inteligentes y soluciones digitales que conectan tecnología con negocios.</p>
    <div class="url"><span class="dot"></span>sneyder.biolnk.si</div>
  </div>
  <div class="photo"><img src="../assets/avatar-ney.webp" alt=""></div>
</div>
<div class="chips"><span class="chip">NEY AGENCY</span><span class="chip">FITPRO SAAS</span><span class="chip">PROYECTOS</span></div>
</body></html>
