<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#08080a;color:#f4f1ea;font-family:"Bricolage Grotesque",system-ui,sans-serif;
       display:grid;grid-template-columns:1fr 430px;position:relative}
  body::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(50% 60% at 6% -10%,rgba(255,184,41,.14),transparent 62%)}
  .l{padding:64px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:1}
  .mono{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.20em;text-transform:uppercase;color:#8c8c93}
  h1{margin:0;font-size:104px;line-height:.84;letter-spacing:-.045em;font-weight:500}
  h1 em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:1.04em;
        display:block;margin-top:6px}
  .row{display:flex;gap:26px;align-items:center}
  .dot{width:11px;height:11px;border-radius:50%;background:#ffb829;box-shadow:0 0 0 6px rgba(255,184,41,.14)}
  .r{position:relative;overflow:hidden}
  .r img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;filter:brightness(.9) saturate(.92)}
  .r::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08080a 0%,rgba(8,8,10,.55) 22%,transparent 60%)}
  .tag{position:absolute;left:56px;bottom:64px;display:flex;gap:10px;align-items:center;z-index:2}
</style></head>
<body>
  <div class="l">
    <span class="mono">Medellín · Colombia</span>
    <div>
      <h1>Sneyder<em>Arroyave</em></h1>
      <div class="row" style="margin-top:34px"><span class="dot"></span>
        <span class="mono" style="color:#d7d4cc">MØRK Studios · Ney Agency</span></div>
    </div>
    <span class="mono">Streetwear · Contenido · Sistemas</span>
  </div>
  <div class="r"><img src="../assets/mork-card.webp" alt=""></div>
</body></html>
